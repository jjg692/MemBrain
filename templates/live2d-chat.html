<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MemBrain 对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    color: #2b2f36;
  }
  .chat-window {
    display: flex; flex-direction: column;
    height: 100%;
  }
  .chat-head {
    padding: 10px 14px;
    background: linear-gradient(135deg, #6a8bff, #9b6aff);
    color: #fff; font-size: 15px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-head .status { font-size: 12px; font-weight: 400; opacity: .85; }
  .chat-body {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
    background: #eceef4;
  }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #6a8bff; color: #fff; border-bottom-right-radius: 4px; }
  .msg.role { align-self: flex-start; background: #fff; color: #2b2f36; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .msg.thinking { align-self: flex-start; background: #fff; color: #9aa0a6; font-style: italic; }
  .msg .who { font-size: 11px; color: #6a8bff; font-weight: 600; margin-bottom: 2px; display:block; }
  .chat-input {
    display: flex; gap: 8px; padding: 10px;
    background: #fff; border-top: 1px solid #e0e3ec;
  }
  .chat-input input {
    flex: 1; padding: 9px 12px; border: 1px solid #d5d9e4; border-radius: 20px;
    outline: none; font-size: 14px;
  }
  .chat-input input:focus { border-color: #6a8bff; }
  .chat-input button {
    padding: 9px 18px; border: none; border-radius: 20px;
    background: linear-gradient(135deg, #6a8bff, #9b6aff); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chat-input button:disabled { opacity: .5; cursor: default; }
  .empty { text-align: center; color: #9aa0a6; font-size: 13px; margin: auto; }
</style>
</head>
<body>
<div class="chat-window">
  <div class="chat-head">
    <span id="chatTitle">💬 对话</span>
    <span class="status" id="chatStatus">连接中…</span>
  </div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <input id="chatInput" placeholder="输入消息…" autocomplete="off">
    <button id="chatSend">发送</button>
  </div>
</div>
<script src="/static/live2d/live2d-chat.js"></script>
</body>
</html>
