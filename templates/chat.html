<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemBrain · 会记住你的 AI 助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sidebar-bg:#2b2f36; --sidebar-hover:#3a3f47; --active:#07c160;
    --chat-bg:#f5f5f5; --bubble-self:#95ec69; --bubble-other:#fff;
    --text:#333; --text-light:#b0b3b8;
  }
  html,body { height:100%; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { display:flex; color:var(--text); overflow:hidden; }

  /* ===== 左侧会话列表 ===== */
  .sidebar { width:300px; background:var(--sidebar-bg); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar-header { padding:14px 16px; font-size:16px; font-weight:600; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; align-items:center; }
  .sidebar-header .brand { color:#07c160; }
  .sidebar-header .admin-link a { color:#9aa0a6; font-size:12px; text-decoration:none; }
  .search-box { padding:10px 12px; }
  .search-box input { width:100%; padding:7px 12px; border:none; border-radius:6px; background:#3a3f47; color:#fff; outline:none; font-size:13px; }
  .contact-list { flex:1; overflow-y:auto; padding:6px 0; }
  .contact-group { padding:6px 16px 4px; font-size:11px; color:var(--text-light); }
  .contact-item { display:flex; align-items:center; padding:10px 16px; cursor:pointer; gap:12px; }
  .contact-item:hover { background:var(--sidebar-hover); }
  .contact-item.active { background:#1f242c; }
  .contact-item img { width:42px; height:42px; border-radius:8px; background:#4a5058; object-fit:cover; }
  .contact-item .info { flex:1; overflow:hidden; }
  .contact-item .name { font-size:14px; }
  .contact-item .desc { font-size:11px; color:var(--text-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contact-item .badge { font-size:11px; color:#9aa0a6; align-self:flex-start; margin-top:4px; }

  /* ===== 右侧聊天窗口 ===== */
  .chat { flex:1; display:flex; flex-direction:column; background:var(--chat-bg); min-width:0; }
  .chat-header { height:56px; background:#fff; display:flex; align-items:center; padding:0 20px; border-bottom:1px solid #e8e8e8; gap:12px; }
  .chat-header .role-select { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .chat-header select { padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; outline:none; }
  .chat-header .new-room-btn { padding:6px 14px; background:var(--active); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
  .msg-list { flex:1; overflow-y:auto; padding:20px; }
  .msg { display:flex; margin-bottom:18px; gap:10px; }
  .msg .avatar { width:40px; height:40px; border-radius:6px; background:#07c160; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
  .msg .avatar img { width:40px; height:40px; border-radius:6px; object-fit:cover; }
  .msg-body { max-width:65%; }
  .msg-meta { font-size:11px; color:#999; margin-bottom:4px; }
  .msg-bubble { padding:10px 14px; border-radius:8px; line-height:1.6; font-size:14px; white-space:pre-wrap; word-break:break-word; position:relative; }
  .msg.self { flex-direction:row-reverse; }
  .msg.self .msg-body { text-align:right; }
  .msg.self .msg-bubble { background:var(--bubble-self); border-top-right-radius:2px; }
  .msg.other .msg-bubble { background:var(--bubble-other); border-top-left-radius:2px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .msg.system { justify-content:center; }
  .msg.system .msg-bubble { background:transparent; color:#999; font-size:12px; box-shadow:none; }
  .msg.thinking .msg-bubble::after { content:""; display:inline-block; width:3px; height:14px; background:#999; margin-left:4px; vertical-align:-2px; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0; } }

  .chat-input { background:#fff; border-top:1px solid #e8e8e8; padding:12px 20px 16px; }
  .msg-input-wrap { display:flex; gap:10px; align-items:flex-end; }
  .msg-input-wrap textarea { flex:1; resize:none; border:none; outline:none; font-size:14px; line-height:1.5; max-height:120px; padding:6px 0; font-family:inherit; }
  .send-btn { background:var(--active); color:#fff; border:none; border-radius:6px; padding:8px 22px; cursor:pointer; font-size:14px; }
  .send-btn:disabled { opacity:.5; cursor:not-allowed; }
  .tool-tip { font-size:11px; color:#b0b3b8; margin-top:6px; }

  /* ===== 新群聊弹窗 ===== */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-mask.show { display:flex; }
  .modal { background:#fff; border-radius:10px; width:420px; max-width:92vw; padding:24px; }
  .modal h3 { font-size:17px; margin-bottom:16px; }
  .modal label { font-size:13px; color:#666; display:block; margin:12px 0 6px; }
  .modal input { width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; }
  .modal .member-list { border:1px solid #eee; border-radius:6px; max-height:200px; overflow-y:auto; padding:6px; }
  .modal .member-item { display:flex; align-items:center; gap:10px; padding:8px 10px; cursor:pointer; border-radius:6px; }
  .modal .member-item:hover { background:#f5f5f5; }
  .modal .member-item input { width:auto; margin-right:6px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .modal-actions button { padding:8px 18px; border-radius:6px; border:none; cursor:pointer; font-size:14px; }
  .btn-cancel { background:#eee; color:#333; }
  .btn-confirm { background:var(--active); color:#fff; }
</style>
</head>
<body>
  <!-- ===== 左侧 ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="brand">💬 MemBrain</span>
      <span class="admin-link"><a href="/admin" target="_blank">后台管理 →</a></span>
    </div>
    <div class="search-box"><input id="searchInput" placeholder="搜索联系人…"></div>
    <div class="contact-list" id="contactList"></div>
  </aside>

  <!-- ===== 右侧 ===== -->
  <main class="chat">
    <div class="chat-header">
      <div><strong id="chatTitle">请选择一个联系人</strong></div>
      <div class="role-select" id="roleSelectWrap" style="display:none">
        <span style="font-size:13px;color:#666">当前角色</span>
        <select id="roleSelect"></select>
        <button class="new-room-btn" id="newRoomBtn">＋ 发起群聊</button>
      </div>
    </div>

    <div class="msg-list" id="msgList">
      <div class="msg system"><div class="msg-body"><div class="msg-bubble">Hi～选择一个角色开始聊天吧 ✧</div></div></div>
    </div>

    <div class="chat-input">
      <div class="msg-input-wrap">
        <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
      <div class="tool-tip">支持联网搜索 / 电脑控制 / 记住你说过的话（MemBrain）</div>
    </div>
  </main>

  <!-- ===== 新群聊弹窗 ===== -->
  <div class="modal-mask" id="roomModal">
    <div class="modal">
      <h3>发起群聊</h3>
      <label>群聊名称（英文/数字）</label>
      <input id="roomIdInput" placeholder="如 group1">
      <label>话题（可选）</label>
      <input id="roomTopicInput" placeholder="群聊话题">
      <label>选择成员（至少 2 个角色）</label>
      <div class="member-list" id="roomMembers"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRoomModal()">取消</button>
        <button class="btn-confirm" onclick="createRoom()">创建</button>
      </div>
    </div>
  </div>

<script>
// ===================== 全局状态 =====================
let contacts = [];
let activeType = null;   // 'private' | 'room'
let activeKey = null;    // user_id 或 room_id
let activeRole = 'kasumi';
let privateWs = null;
let roomWs = null;
let messagesCache = {};  // key -> [{role, content, sender}]
let typingTimers = {};
const AV = { kasumi: 0, kokoro: 0 };

const $ = id => document.getElementById(id);

// ===================== 加载联系人 =====================
async function loadContacts() {
  try {
    const res = await fetch('/api/contacts');
    const json = await res.json();
    contacts = json.data || [];
    renderContacts();
    populateRoleSelect();
    populateRoomMemberList();
  } catch(e) { console.error(e); }
}

function renderContacts(filter='') {
  const list = $('contactList');
  list.innerHTML = '';
  const filtered = contacts.filter(c => !filter || (c.display_name||'').includes(filter) || (c.role_id||'').includes(filter));

  // 私聊分组
  if (filtered.some(c => c.role_id === activeRole)) {
    list.innerHTML += `<div class="contact-group">私聊</div>`;
  }
  filtered.forEach(c => {
    const div = document.createElement('div');
    div.className = 'contact-item' + (activeType==='private' && activeKey==='default_user' && c.role_id===activeRole ? ' active' : '');
    div.innerHTML = avatarHTML(c) + `<div class="info"><div class="name">${esc(c.display_name)}</div><div class="desc">${esc(c.description||'AI 助手')}</div></div>`;
    div.onclick = () => openPrivate(c.role_id);
    list.appendChild(div);
  });

  // 群聊分组
  if (filtered.length) list.innerHTML += `<div class="contact-group">群聊</div>`;
  list.innerHTML += `<div class="contact-item" id="roomListPlaceholder" style="color:#9aa0a6">加载群聊中…</div>`;
  loadRoomsIntoList();
}

function avatarHTML(c) {
  if (c.avatar_url) return `<img src="${c.avatar_url}" onerror="this.style.display='none'"><span class="badge">${esc((c.display_name||'')[0])}</span>`;
  return `<div class="avatar">${esc((c.display_name||'R')[0])}</div>`;
}

async function loadRoomsIntoList() {
  try {
    const res = await fetch('/api/rooms');
    const json = await res.json();
    const rooms = json.data || [];
    const list = $('contactList');
    // 移除占位
    const ph = $('roomListPlaceholder'); if (ph) ph.remove();
    rooms.forEach(r => {
      const div = document.createElement('div');
      div.className = 'contact-item' + (activeType==='room' && activeKey===r.room_id ? ' active' : '');
      div.innerHTML = `<div class="avatar" style="background:#5b8ff9">👥</div><div class="info"><div class="name">${esc(r.room_id)}</div><div class="desc">${esc(r.topic||'群聊')} · ${(r.members||[]).length} 成员</div></div>`;
      div.onclick = () => openRoom(r.room_id);
      list.appendChild(div);
    });
  } catch(e) { console.error(e); }
}

function populateRoleSelect() {
  const sel = $('roleSelect'); sel.innerHTML = '';
  contacts.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.role_id; opt.text = c.display_name;
    const def = c.default || (c.role_id===activeRole);
    if (def) { opt.selected = true; if(!activeRole) activeRole = c.role_id; if(c.role_id===activeRole&&!c.default){} }
    sel.appendChild(opt);
  });
  sel.onchange = () => { activeRole = sel.value; renderContacts(); if(activeType==='private') openPrivate(activeRole); };
}

function populateRoomMemberList() {
  const box = $('roomMembers'); box.innerHTML = '';
  contacts.forEach(c => {
    const label = document.createElement('label');
    label.className = 'member-item';
    label.innerHTML = `<input type="checkbox" value="${c.role_id}" class="room-member-cb"> ${avatarHTML(c)} ${esc(c.display_name)}`;
    box.appendChild(label);
  });
}

// ===================== 打开私聊 =====================
function openPrivate(roleId) {
  activeType = 'private';
  activeKey = 'default_user';
  activeRole = roleId;
  $('chatTitle').textContent = '私聊 · ' + (contacts.find(c=>c.role_id===roleId)?.display_name || roleId);
  $('roleSelectWrap').style.display = 'flex';
  closeRoomWs();
  connectPrivateWs(roleId);
  $('msgList').innerHTML = '';
  loadHistory(roleId);
  updateActiveUI();
}

function updateActiveUI() {
  document.querySelectorAll('.contact-item').forEach(el => el.classList.remove('active'));
}

// ===================== WebSocket：私聊 =====================
function connectPrivateWs(roleId) {
  if (privateWs) { try{privateWs.close();}catch(e){} }
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  privateWs = new WebSocket(`${proto}://${location.host}/ws/chat?user_id=default_user&role_id=${roleId}`);
  privateWs.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type === 'thinking') {
      showThinking();
    } else if (d.type === 'reply') {
      removeThinking();
      appendMessage({ role:'assistant', content:d.content, sender:roleId });
    } else if (d.type === 'proactive') {
      // L3/定时主动消息：Agent 主动开口
      appendMessage({ role:'assistant', content:d.content, sender:d.role_id || roleId });
    }
  };
}

function showThinking() {
  removeThinking();
  const div = document.createElement('div');
  div.className='msg other thinking'; div.id='thinkingMsg';
  div.innerHTML = `<div class="avatar" style="background:#07c160">✦</div><div class="msg-body"><div class="msg-bubble">香澄正在思考</div></div>`;
  $('msgList').appendChild(div); scrollBottom();
}
function removeThinking() { const t=$('thinkingMsg'); if(t) t.remove(); }

function appendMessage({role, content, sender}) {
  const div = document.createElement('div');
  const isSelf = role==='user';
  const senderName = contacts.find(c=>c.role_id===sender)?.display_name || sender;
  div.className = 'msg ' + (isSelf?'self':'other');
  const av = isSelf ? `<div class="avatar" style="background:#5b8ff9">我</div>`
                    : `<div class="avatar">${esc((senderName||'?')[0])}</div>`;
  div.innerHTML = av + `<div class="msg-body"><div class="msg-meta">${isSelf?'我':esc(senderName)}</div><div class="msg-bubble">${esc(content)}</div></div>`;
  $('msgList').appendChild(div); scrollBottom();

  const key = activeType+':'+activeKey;
  if (!messagesCache[key]) messagesCache[key]=[];
  messagesCache[key].push({role, content, sender});
}

function scrollBottom(){ const l=$('msgList'); l.scrollTop = l.scrollHeight; }

async function loadHistory(roleId) {
  const key = 'private:default_user';
  if (messagesCache[key]) {
    messagesCache[key].forEach(m => appendMessageDirect(m));
    scrollBottom(); return;
  }
  try {
    const res = await fetch(`/api/history?user_id=default_user&role_id=${roleId}&n=30`);
    const json = await res.json();
    (json.data||[]).forEach(m => appendMessageDirect({role:m.role, content:m.content, sender:roleId}));
    messagesCache[key]=json.data||[];
    scrollBottom();
  } catch(e){}
}
function appendMessageDirect(m){ appendMessage(m); }

// ===================== 群聊 =====================
function openRoom(roomId) {
  activeType='room'; activeKey=roomId;
  $('chatTitle').textContent = '群聊 · ' + roomId;
  $('roleSelectWrap').style.display='none';
  closePrivateWs();
  connectRoomWs(roomId);
  $('msgList').innerHTML='';
  loadRoomHistory(roomId);
}

function connectRoomWs(roomId) {
  if (roomWs) { try{roomWs.close();}catch(e){} }
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  roomWs = new WebSocket(`${proto}://${location.host}/ws/room/${roomId}?role_id=web_user`);
  roomWs.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.type==='chat_message') {
      const m = d.data;
      if (m.is_user) {
        appendMessageDirect({role:'user', content:m.content, sender:m.sender_role||'user'});
      } else if (m.msg_type==='system') {
        appendSystem(m.content);
      } else {
        appendMessageDirect({role:'assistant', content:m.content, sender:m.sender_role});
      }
    }
  };
}

async function loadRoomHistory(roomId) {
  const key='room:'+roomId;
  if (messagesCache[key]) { messagesCache[key].forEach(m=>appendMessageDirect(m)); scrollBottom(); return; }
  try {
    const res=await fetch(`/api/rooms/${roomId}/messages?n=30`);
    const json=await res.json();
    (json.data||[]).forEach(m=>{
      if(m.msg_type==='system') appendSystem(m.content);
      else if(m.is_user) appendMessageDirect({role:'user',content:m.content,sender:m.sender_role});
      else appendMessageDirect({role:'assistant',content:m.content,sender:m.sender_role});
    });
    messagesCache[key]=json.data||[];
    scrollBottom();
  }catch(e){}
}
function appendSystem(text){
  const div=document.createElement('div');
  div.className='msg system';
  div.innerHTML=`<div class="msg-body"><div class="msg-bubble">${esc(text)}</div></div>`;
  $('msgList').appendChild(div); scrollBottom();
}

// ===================== 发送 =====================
function send() {
  const input=$('msgInput');
  const text=input.value.trim();
  if(!text) return;
  if(activeType==='private'){
    appendMessageDirect({role:'user',content:text,sender:activeRole});
    if(privateWs && privateWs.readyState===1){
      privateWs.send(JSON.stringify({content:text, role_id:activeRole}));
    }
  } else if(activeType==='room'){
    appendMessageDirect({role:'user',content:text,sender:'我'});
    if(roomWs && roomWs.readyState===1){
      roomWs.send(JSON.stringify({content:text, role_id:'web_user', user_id:'default_user'}));
    }
  }
  input.value=''; input.style.height='auto';
}

// ===================== 群聊创建弹窗 =====================
function closeRoomModal(){ $('roomModal').classList.remove('show'); }
function showRoomModal(){ renderContacts(); populateRoomMemberList(); $('roomModal').classList.add('show'); }
async function createRoom(){
  const roomId=$('roomIdInput').value.trim();
  const topic=$('roomTopicInput').value.trim();
  const members=[...document.querySelectorAll('.room-member-cb:checked')].map(cb=>cb.value);
  if(!roomId){alert('请输入群聊名称');return;}
  const res=await fetch('/api/rooms/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_id:roomId,topic})});
  const json=await res.json();
  if(json.code!==0){alert(json.message);return;}
  for(const roleId of members){
    await fetch(`/api/rooms/${roomId}/join`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role_id:roleId})});
  }
  closeRoomModal();
  $('roomIdInput').value=''; $('roomTopicInput').value='';
  openRoom(roomId);
  loadRoomsIntoList();
}

// ===================== 工具函数 =====================
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function closePrivateWs(){ if(privateWs){try{privateWs.close();}catch(e){} privateWs=null;} }
function closeRoomWs(){ if(roomWs){try{roomWs.close();}catch(e){} roomWs=null;} }

// ===================== 事件绑定 =====================
$('sendBtn').onclick=send;
$('msgInput').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('msgInput').addEventListener('input',function(){ this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,120)+'px'; });
$('newRoomBtn').onclick=showRoomModal;
$('searchInput').addEventListener('input',e=>renderContacts(e.target.value.trim()));

loadContacts();
setInterval(loadRoomsIntoList, 15000);
</script>
</body>
</html>
