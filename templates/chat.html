<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemBrain · 会记住你的 AI 助手</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --sidebar-bg:#2b2f36; --sidebar-hover:#3a3f47; --active:#07c160;
    --chat-bg:#f5f5f5; --bubble-self:#95ec69; --bubble-other:#fff;
    --text:#333; --text-light:#b0b3b8;
  }
  html,body { height:100%; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { display:flex; color:var(--text); overflow:hidden; }

  /* ===== 左侧会话列表 ===== */
  .sidebar { width:300px; background:var(--sidebar-bg); color:#fff; display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar-header { padding:14px 16px; font-size:16px; font-weight:600; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; align-items:center; }
  .sidebar-header .brand { color:#07c160; }
  .sidebar-header .admin-link a { color:#9aa0a6; font-size:12px; text-decoration:none; }
  .user-bar { display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid rgba(255,255,255,.06); cursor:pointer; }
  .user-bar .user-avatar { width:30px; height:30px; border-radius:50%; background:#07c160; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; flex-shrink:0; }
  .user-bar .user-info { flex:1; min-width:0; }
  .user-bar .user-name { font-size:13px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-bar .user-edit { font-size:11px; color:#9aa0a6; }
  .user-bar .user-edit input { width:100%; padding:5px 8px; border:none; border-radius:5px; background:#3a3f47; color:#fff; outline:none; font-size:13px; }
  .search-box { padding:10px 12px; }
  .search-box input { width:100%; padding:7px 12px; border:none; border-radius:6px; background:#3a3f47; color:#fff; outline:none; font-size:13px; }
  .contact-list { flex:1; overflow-y:auto; padding:6px 0; }
  .contact-group { padding:6px 16px 4px; font-size:11px; color:var(--text-light); }
  .contact-item { display:flex; align-items:center; padding:10px 16px; cursor:pointer; gap:12px; }
  .contact-item:hover { background:var(--sidebar-hover); }
  .contact-item.active { background:#1f242c; }
  .contact-item img { width:42px; height:42px; border-radius:8px; background:#4a5058; object-fit:cover; }
  .contact-item .info { flex:1; overflow:hidden; }
  .contact-item .name { font-size:14px; }
  .contact-item .desc { font-size:11px; color:var(--text-light); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .contact-item .badge { font-size:11px; color:#9aa0a6; align-self:flex-start; margin-top:4px; }

  /* ===== 右侧聊天窗口 ===== */
  .chat { flex:1; display:flex; flex-direction:column; background:var(--chat-bg); min-width:0; }
  .chat-header { height:56px; background:#fff; display:flex; align-items:center; padding:0 20px; border-bottom:1px solid #e8e8e8; gap:12px; }
  .chat-header .role-select { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .chat-header select { padding:6px 10px; border:1px solid #ddd; border-radius:6px; font-size:13px; outline:none; }
  .chat-header .new-room-btn { padding:6px 14px; background:var(--active); color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
  .chat-header .room-config-btn { padding:6px 12px; background:#fff; color:#555; border:1px solid #ddd; border-radius:6px; cursor:pointer; font-size:13px; }
  .msg-list { flex:1; overflow-y:auto; padding:20px; }
  .msg { display:flex; margin-bottom:18px; gap:10px; }
  .msg .avatar { width:40px; height:40px; border-radius:6px; background:#07c160; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex-shrink:0; }
  .msg .avatar img { width:40px; height:40px; border-radius:6px; object-fit:cover; }
  .msg-body { max-width:65%; }
  .msg-meta { font-size:11px; color:#999; margin-bottom:4px; }
  .msg-bubble { padding:10px 14px; border-radius:8px; line-height:1.6; font-size:14px; white-space:pre-wrap; word-break:break-word; position:relative; }
  .msg.self { flex-direction:row-reverse; }
  .msg.self .msg-body { text-align:right; }
  .msg.self .msg-bubble { background:var(--bubble-self); border-top-right-radius:2px; }
  .msg.other .msg-bubble { background:var(--bubble-other); border-top-left-radius:2px; box-shadow:0 1px 2px rgba(0,0,0,.05); }
  .msg.system { justify-content:center; }
  .msg.system .msg-bubble { background:transparent; color:#999; font-size:12px; box-shadow:none; }
  .msg.thinking .msg-bubble::after { content:""; display:inline-block; width:3px; height:14px; background:#999; margin-left:4px; vertical-align:-2px; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .behavior-hint { font-size:11px; color:#999; margin-top:4px; }

  .chat-input { background:#fff; border-top:1px solid #e8e8e8; padding:12px 20px 16px; }
  .msg-input-wrap { display:flex; gap:10px; align-items:flex-end; }
  .msg-input-wrap textarea { flex:1; resize:none; border:none; outline:none; font-size:14px; line-height:1.5; max-height:120px; padding:6px 0; font-family:inherit; }
  .send-btn { background:var(--active); color:#fff; border:none; border-radius:6px; padding:8px 22px; cursor:pointer; font-size:14px; }
  .send-btn:disabled { opacity:.5; cursor:not-allowed; }
  .tool-tip { font-size:11px; color:#b0b3b8; margin-top:6px; }

  /* ===== 新群聊弹窗 ===== */
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-mask.show { display:flex; }
  .modal { background:#fff; border-radius:10px; width:420px; max-width:92vw; padding:24px; }
  .modal h3 { font-size:17px; margin-bottom:16px; }
  .modal label { font-size:13px; color:#666; display:block; margin:12px 0 6px; }
  .modal input { width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:6px; font-size:14px; outline:none; }
  .modal .member-list { border:1px solid #eee; border-radius:6px; max-height:200px; overflow-y:auto; padding:6px; }
  .modal .member-item { display:flex; align-items:center; gap:10px; padding:8px 10px; cursor:pointer; border-radius:6px; }
  .modal .member-item:hover { background:#f5f5f5; }
  .modal .member-item input { width:auto; margin-right:6px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .modal-actions button { padding:8px 18px; border-radius:6px; border:none; cursor:pointer; font-size:14px; }
  .btn-cancel { background:#eee; color:#333; }
  .btn-confirm { background:var(--active); color:#fff; }
</style>
</head>
<body>
  <!-- ===== 左侧 ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="brand">💬 MemBrain</span>
      <span class="admin-link"><a href="/live2d">Live2D</a> · <a href="/admin" target="_blank">后台管理 →</a></span>
    </div>
    <div class="user-bar" id="userBar" title="点击修改我的昵称">
      <div class="user-avatar" id="userAvatar">我</div>
      <div class="user-info">
        <div class="user-name" id="userName">我</div>
        <div class="user-edit" id="userEditHint">点击修改昵称 ✎</div>
      </div>
    </div>
    <div class="search-box"><input id="searchInput" placeholder="搜索联系人…"></div>
    <div class="contact-list" id="contactList"></div>
  </aside>

  <!-- ===== 右侧 ===== -->
  <main class="chat">
    <div class="chat-header">
      <div><strong id="chatTitle">请选择一个联系人</strong></div>
      <button class="room-config-btn" id="roomConfigBtn" style="display:none">群聊设置 ⚙</button>
      <div class="role-select" id="roleSelectWrap" style="display:none">
        <span style="font-size:13px;color:#666">当前角色</span>
        <select id="roleSelect"></select>
        <button class="new-room-btn" id="newRoomBtn">＋ 发起群聊</button>
      </div>
    </div>

    <div class="msg-list" id="msgList">
      <div class="msg system"><div class="msg-body"><div class="msg-bubble">Hi～选择一个角色开始聊天吧 ✧</div></div></div>
    </div>

    <div class="chat-input">
      <div class="msg-input-wrap">
        <textarea id="msgInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
      <div class="tool-tip">支持联网搜索 / 电脑控制 / 记住你说过的话（MemBrain）</div>
    </div>
  </main>

  <!-- ===== 新群聊弹窗 ===== -->
  <div class="modal-mask" id="roomModal">
    <div class="modal">
      <h3>发起群聊</h3>
      <label>群聊名称（英文/数字）</label>
      <input id="roomIdInput" placeholder="如 group1">
      <label>话题（可选）</label>
      <input id="roomTopicInput" placeholder="群聊话题">
      <label>选择成员（至少 2 个角色）</label>
      <div class="member-list" id="roomMembers"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRoomModal()">取消</button>
        <button class="btn-confirm" onclick="createRoom()">创建</button>
      </div>
    </div>
  </div>

  <!-- ===== 群聊设置弹窗（C 阶段） ===== -->
  <div class="modal-mask" id="roomConfigModal">
    <div class="modal">
      <h3>群聊设置</h3>
      <div id="roomConfigBody"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeRoomConfigModal()">取消</button>
        <button class="btn-confirm" onclick="saveRoomConfig()">保存</button>
      </div>
    </div>
  </div>

<script type="module" src="/static/chat/main.js"></script>
</body>
</html>
